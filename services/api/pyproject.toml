[project]
name = "agnidrishti-api"
version = "0.1.0"
description = "AGNIDRISHTI Backend — AI-enabled geospatial industrial thermal intelligence API"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # HTTP client
    "httpx>=0.27.0",
    # Database
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.2.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.13.0",
    # Data / scientific
    "numpy>=1.26.0",
    "shapely>=2.0.0",
    "rasterio>=1.4.0",
    "pyproj>=3.7.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
geo-heavy = [
    "geopandas>=1.0.0",
    "rasterio>=1.3.0",
]
satellite = [
    "earthengine-api>=1.1.0",
]
ml-advanced = [
    "xgboost>=2.1.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]
all = [
    "agnidrishti-api[geo-heavy,satellite,ml-advanced,dev]",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
