services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: agnidrishti_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agnidrishti}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agnidrishti_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agnidrishti}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agnidrishti_postgis_data:
    name: agnidrishti_postgis_data
